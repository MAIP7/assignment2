<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ariful Islam</title>
  <p>ID:2026512867</p>
  
  <!-- Tailwind CSS & Markdown Parser -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 md:px-6 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white shadow">
        AI
      </div>
      <div>
        <h1 class="text-sm md:text-base font-bold text-white">Ariful Islam</h1>
        <p class="text-xs text-emerald-400">● GitHub Pages Ready</p>
      </div>
    </div>
    
    <!-- API Key Input -->
    <div class="flex items-center gap-2">
      <input 
        type="password" 
        id="apiKeyInput" 
        placeholder="Paste your Gemini API Key..." 
        class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 w-36 md:w-60"
      />
      <button 
        id="saveKeyBtn"
        class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs px-3 py-1.5 rounded-lg transition font-medium">
        Save Key
      </button>
    </div>
  </header>

  <!-- Chat Messages -->
  <main id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-4xl w-full mx-auto">
    <div class="flex items-start gap-3">
      <div class="w-8 h-8 rounded-full bg-cyan-600 flex items-center justify-center text-xs font-bold text-white shrink-0">
        AI
      </div>
      <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-none p-4 max-w-[85%] text-slate-200 text-sm leading-relaxed shadow">
        Hello! To get started, get your free key from 
        <a href="https://aistudio.google.com/" target="_blank" class="text-cyan-400 underline">Google AI Studio</a>, 
        paste it above, click <b>Save Key</b>, and start chatting!
      </div>
    </div>
  </main>

  <!-- Input Area -->
  <footer class="bg-slate-800/80 backdrop-blur border-t border-slate-700 p-4">
    <form id="chatForm" class="max-w-4xl mx-auto flex gap-3">
      <input 
        type="text" 
        id="userInput" 
        placeholder="Type your message here..." 
        autocomplete="off"
        class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500"
      />
      <button 
        type="submit" 
        id="sendBtn"
        class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium px-6 py-3 rounded-xl transition disabled:opacity-50">
        Send
      </button>
    </form>
  </footer>

  <script src="app.js"></script>
</body>
</html>
